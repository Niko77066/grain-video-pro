<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="hero.css">
<title>hero3 · 结论镜</title>
<style>
  /* G2 hero 门 must_fix s08：标题块下沉压回左下 1/3 金线上（与 s01/s05 手柄执行对齐，
     不再让纯字卡自成一格）；上方空带补 kicker + 口径行承载信息。 */
  .endline { position:absolute; left:var(--safe); bottom:180px; width:1180px; }
  .endline .q { font:700 92px/1.22 SerifSC; letter-spacing:.01em; }
  .endline .q em { font-style:normal; color:var(--gold); }
  .split { position:absolute; right:var(--safe); top:50%; transform:translateY(-50%);
           width:440px; text-align:right; }
  .split .row { margin-bottom:44px; }
  .split .k { font:400 25px/1 SansSC; color:var(--ink-dim); letter-spacing:.08em; }
  .split .v { margin-top:10px; font:700 62px/1 SansSC; font-variant-numeric:tabular-nums; }
  .bar { margin-top:14px; height:10px; background:rgba(255,255,255,.10); }
  .bar i { display:block; height:100%; }
</style>
<div class="stage">
  <div class="studio"></div>
  <div class="bug"><span class="mark"></span><span class="txt">经济半年报</span><span class="date">2026 上半年</span></div>

  <div style="position:absolute;left:96px;top:238px;width:1180px">
    <div class="kicker">上半年这一棒，谁在跑</div>
    <div style="margin-top:22px;font:400 30px/1.6 SansSC;color:var(--ink-dim);max-width:900px">
      外需与高技术制造在加速，投资与消费在减速。<br>
      口径：2026 年上半年累计同比，国家统计局 7 月 15 日发布。
    </div>
  </div>

  <div class="rule" style="left:96px;bottom:166px;width:1080px"></div>
  <div class="endline">
    <div class="q">下半年要看的，<br>是<em>内需</em>能不能接得住。</div>
  </div>

  <div class="split">
    <div class="row">
      <div class="k">货物进出口 · 同比</div>
      <div class="v" style="color:var(--gold)">+16.9%</div>
      <div class="bar"><i style="width:100%;background:var(--gold)"></i></div>
    </div>
    <div class="row">
      <div class="k">高技术制造业增加值</div>
      <div class="v" style="color:var(--gold)">+13.3%</div>
      <div class="bar"><i style="width:79%;background:var(--gold)"></i></div>
    </div>
    <div class="row">
      <div class="k">社会消费品零售总额</div>
      <div class="v" style="color:#E8555C">+1.3%</div>
      <div class="bar"><i style="width:8%;background:#E8555C"></i></div>
    </div>
  </div>

  <div class="foot">数据来源：国家统计局 2026 年 7 月 15 日发布　｜　全部为 2026 年上半年累计同比</div>
</div>
