<!doctype html><meta charset="utf-8"><link rel="stylesheet" href="hero.css">
<title>hero2 · 核心隐喻镜</title>
<style>
  /* G2 hero 门 must_fix s05：① 卡片收小右移，不再整块盖住岸桥主体；
     ② 图例与末端标注去重；③ 折线改条形——月度累计序列本仓无可回链数据，
     不画看不懂刻度也编不出来的曲线，只画 research 里有的三个累计同比值。 */
  .chartcard { width:706px; height:534px; top:196px; }
  .bars { position:absolute; left:36px; right:36px; top:158px; }
  .brow { margin-bottom:30px; }
  .brow .bk { display:flex; justify-content:space-between; align-items:baseline;
              font:400 25px/1 SansSC; color:var(--ink-dim); }
  .brow .bk b { font:700 40px/1 SansSC; font-variant-numeric:tabular-nums; color:var(--ink); }
  .btrack { margin-top:12px; height:16px; background:rgba(255,255,255,.09); }
  .btrack i { display:block; height:100%; }
  .scale { display:flex; justify-content:space-between; margin-top:6px;
           font:400 19px/1 SansSC; color:#6E88A8; font-variant-numeric:tabular-nums; }
  .cfoot { position:absolute; left:36px; right:36px; bottom:26px; padding-top:18px;
           border-top:1px solid rgba(255,255,255,.10);
           font:400 22px/1.5 SansSC; color:var(--ink-dim); }
  .cfoot b { color:var(--gold); font-weight:700; }
</style>
<div class="stage">
  <div class="bed grade-cool"><img src="_port.jpg" alt=""></div>
  <div class="veil"></div>

  <div class="bug"><span class="mark"></span><span class="txt">经济半年报</span><span class="date">2026 上半年</span></div>

  <div class="chartcard">
    <div class="ct">货物进出口 · 累计同比</div>
    <div class="cs">上半年 25.47 万亿元</div>
    <div class="bars">
      <div class="brow">
        <div class="bk"><span>进出口合计</span><b style="color:var(--gold)">+16.9%</b></div>
        <div class="btrack"><i style="width:68%;background:var(--gold)"></i></div>
      </div>
      <div class="brow">
        <div class="bk"><span>出口 14.73 万亿元</span><b>+13.4%</b></div>
        <div class="btrack"><i style="width:54%;background:#8FA8C4"></i></div>
      </div>
      <div class="brow">
        <div class="bk"><span>进口 10.74 万亿元</span><b style="color:#5FB0E8">+22.1%</b></div>
        <div class="btrack"><i style="width:88%;background:#5FB0E8"></i></div>
        <div class="scale"><span>0%</span><span>5%</span><span>10%</span><span>15%</span><span>20%</span><span>25%</span></div>
      </div>
    </div>
    <div class="cfoot">其中机电产品出口 <b>+20.1%</b>，占出口总额 <b>63.5%</b></div>
  </div>

  <div class="rule" style="left:96px;bottom:112px;width:760px"></div>
  <div class="lower" style="bottom:126px">
    <div class="kicker">谁扛起了 4.7%</div>
    <div class="headline">外贸</div>
  </div>
  <div class="foot">数据来源：国家统计局 2026 年 7 月 15 日发布　｜　画面：港口装卸作业（示意空镜）</div>
</div>
